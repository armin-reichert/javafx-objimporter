name: Build and Attach Installers

on:
  release:
    types: [published]

jobs:
  build:
    name: Build Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make Gradle executable (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: Build installers
        run: |
          ./gradlew clean jpackage
        shell: bash

      - name: Collect installers
        id: collect
        run: |
          mkdir artifacts
          cp -r **/build/jpackage/* artifacts/ || true
        shell: bash

      - name: Upload installers as release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/build/jpackage/*.msi
            **/build/jpackage/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

